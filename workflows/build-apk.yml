name: Build APK Cashflow Tulip 175

on:
  workflow_dispatch:          # tombol "Run workflow" manual
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Cashflow_Tulip_175.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Cashflow_Tulip_175_APK
          path: Cashflow_Tulip_175.apk
          if-no-files-found: error
