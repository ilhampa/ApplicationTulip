plugins {
    id 'com.android.application'
}

android {
    namespace 'id.ilham.tulip175'
    compileSdk 34

    defaultConfig {
        applicationId "id.ilham.tulip175"
        minSdk 29          // Android 10+
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    // Tanda tangan tetap (stabil) agar APK versi baru bisa dipasang DI ATAS versi lama tanpa kehilangan data.
    // Untuk pemakaian pribadi (sideload). Jangan dipakai untuk Play Store.
    signingConfigs {
        tulip {
            storeFile file('tulip175.jks')
            storePassword 'tulip175pass'
            keyAlias 'tulip175'
            keyPassword 'tulip175pass'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.tulip
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.tulip
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Sumber tunggal aplikasi web ada di ../webapp/www  ->  di APK menjadi assets/www
    sourceSets {
        main {
            assets.srcDirs += file("$rootDir/../webapp")
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
